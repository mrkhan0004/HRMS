version: '3.8'

services:
  # 1. SQL Database Setup (MariaDB)
  mariadb:
    image: mariadb:10.6
    container_name: frappe-mariadb
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=your_super_secret_password # Yahan apna password daalo
      - MYSQL_DATABASE=frappe
      - MYSQL_USER=frappe
      - MYSQL_PASSWORD=frappe_db_password # Yahan bhi apna password daalo
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - frappe-network

  # 2. Redis Setup (Frappe ke liye zaroori hai)
  redis-cache:
    image: redis:alpine
    container_name: frappe-redis-cache
    restart: always
    networks:
      - frappe-network

  redis-queue:
    image: redis:alpine
    container_name: frappe-redis-queue
    restart: always
    networks:
      - frappe-network

  redis-socketio:
    image: redis:alpine
    container_name: frappe-redis-socketio
    restart: always
    networks:
      - frappe-network

  # 3. Frappe App Setup
  frappe:
    image: frappe/frappe-worker:latest
    container_name: frappe-app
    restart: always
    environment:
      - FRAPPE_SITE_NAME=your-site.com # Apna domain ya IP yahan daalo
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=frappe
      - DB_USER=frappe
      - DB_PASSWORD=frappe_db_password # Yeh upar wali password same honi chahiye
      - REDIS_CACHE_HOST=redis-cache
      - REDIS_QUEUE_HOST=redis-queue
      - REDIS_SOCKETIO_HOST=redis-socketio
    ports:
      - "8000:8000" # Frappe Web port
      - "9000:9000" # Socketio port
    volumes:
      - frappe-assets:/home/frappe/frappe-bench/sites/assets
      - frappe-logs:/home/frappe/frappe-bench/logs
    depends_on:
      - mariadb
      - redis-cache
      - redis-queue
      - redis-socketio
    networks:
      - frappe-network

volumes:
  mariadb-data:
  frappe-assets:
  frappe-logs:

networks:
  frappe-network:
    driver: bridge
